name: DB write-permission guardrail

# Fails the build if a table the app writes lacks the matching grant + RLS policy
# (or a declared service-role route), or if write_permission_audit() flags a live
# gap. Prevents the recurring "permission denied before RLS" bug class.

# Runs BOTH as a local Husky pre-push hook (fast feedback, blocks a bad push
# before it leaves the machine) AND automatically here on every push/PR to the
# main branches (Fable H-3) — so the guardrail can't be skipped by `--no-verify`,
# a fresh clone that never ran `npm install`, or a GitHub-UI merge. Make this a
# required status check in branch protection so a red run blocks merge.
# The code-scan half needs no DB; the DB half is best-effort and never fails on
# an unreachable runner (only a genuine grant gap fails).
on:
  push:
    branches: [main, rebuild]
  pull_request:
    branches: [main, rebuild]
  workflow_dispatch: # manual runs from the Actions tab too

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Code-scan half always runs; the DB half runs only if the secrets exist.
      - name: Write-permission audit
        run: node scripts/audit-write-grants.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
