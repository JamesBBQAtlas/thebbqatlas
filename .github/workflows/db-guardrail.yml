name: DB write-permission guardrail

# Fails the build if a table the app writes lacks the matching grant + RLS policy
# (or a declared service-role route), or if write_permission_audit() flags a live
# gap. Prevents the recurring "permission denied before RLS" bug class.

# NOTE: this no longer runs automatically on push. The guardrail now runs as a
# local git pre-push hook (Husky → `npm run audit:grants`), which is stronger (it
# blocks a bad push before it leaves the machine) and has zero dependency on
# GitHub's hosted-runner availability — which caused persistent false-red X's
# during a GitHub Actions runner outage. Kept here for manual/optional runs only.
on:
  workflow_dispatch: # manual runs from the Actions tab only

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Code-scan half always runs; the DB half runs only if the secrets exist.
      - name: Write-permission audit
        run: node scripts/audit-write-grants.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
